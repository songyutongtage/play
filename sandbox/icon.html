<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素沙盒 · 图标生成器</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:#0e1118;color:#dfe6f2;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 20px;
  }
  h1{font-size:18px;font-weight:600;margin:0}
  p{font-size:13px;color:#8b95a8;margin:0;text-align:center;max-width:460px;line-height:1.7}
  .row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .item{display:flex;flex-direction:column;align-items:center;gap:12px}
  canvas{
    width:150px;height:150px;background:#0b0d12;
    border-radius:22%;box-shadow:0 10px 34px rgba(0,0,0,.55);
  }
  button{
    padding:10px 18px;border-radius:10px;border:1px solid #2d3a52;
    background:#1b2333;color:#dfe6f2;font-size:14px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:transform .08s;
  }
  button:active{transform:scale(.95)}
</style>
</head>
<body>
  <h1>像素沙盒 · 图标生成</h1>
  <p>下面是预览效果（实际 PNG 是方形，安卓/iOS 安装时会自动裁圆角）。<br>点按钮下载两个文件，和 index.html 放同一目录。</p>

  <div class="row">
    <div class="item">
      <canvas id="c192" width="192" height="192"></canvas>
      <button id="d192" type="button">下载 icon-192.png</button>
    </div>
    <div class="item">
      <canvas id="c512" width="512" height="512"></canvas>
      <button id="d512" type="button">下载 icon-512.png</button>
    </div>
  </div>

  <p>图标已按 Android 圆形遮罩的安全区留边，可作为 maskable 图标使用。</p>

<script>
/* ====== 想改图案就改这里 ======
   1 = 沙   2 = 水   3 = 火   4 = 火心高亮
   . = 透明（露出深色背景）
   必须是 16 行、每行 16 个字符
*/
const ART = [
  "................",
  "................",
  "................",
  "....3......2....",
  "...343....222...",
  "...343...22222..",
  "....3.....222...",
  "................",
  "..111111111111..",
  ".11111111111111.",
  "1111111111111111",
  "1111111111111111",
  "1111111111111111",
  "................",
  "................",
  "................"
];

const COLORS = {
  '1': '#e0b96e',
  '2': '#2f78de',
  '3': '#ff8c1e',
  '4': '#ffc94a'
};

function build(size) {
  const cv = document.createElement('canvas');
  cv.width = size;
  cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // 背景铺满（maskable 安全）
  ctx.fillStyle = '#0b0d12';
  ctx.fillRect(0, 0, size, size);

  // 16x16 小画布
  const s = document.createElement('canvas');
  s.width = 16;
  s.height = 16;
  const sc = s.getContext('2d');
  for (let y = 0; y < 16; y++) {
    const row = ART[y] || '';
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      if (!ch || ch === '.') continue;
      sc.fillStyle = COLORS[ch] || '#ffffff';
      sc.fillRect(x, y, 1, 1);
    }
  }

  // 放大到中间 74% 区域
  const inner = Math.round(size * 0.74);
  const pad = Math.round((size - inner) / 2);
  ctx.drawImage(s, pad, pad, inner, inner);

  return cv;
}

const src192 = build(192);
const src512 = build(512);

// 预览
const c192 = document.getElementById('c192');
const c512 = document.getElementById('c512');
c192.getContext('2d').drawImage(src192, 0, 0);
c512.getContext('2d').drawImage(src512, 0, 0);

function download(cv, filename) {
  cv.toBlob(function (blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }, 'image/png');
}

document.getElementById('d192').addEventListener('click', function () {
  download(src192, 'icon-192.png');
});
document.getElementById('d512').addEventListener('click', function () {
  download(src512, 'icon-512.png');
});
</script>
</body>
</html>
